<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OnlineCourse{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f5f7fb;color:#17233b;font-family:Arial,sans-serif;margin:0}
    .container{max-width:1000px;margin:auto;padding:24px}
    .navbar{background:#132746;color:white}.navbar a{color:white;margin-right:20px}
    .card{background:white;border:1px solid #dfe5ee;border-radius:12px;padding:22px;margin-bottom:18px}
    .btn{display:inline-block;padding:10px 20px;border:0;border-radius:6px;cursor:pointer;text-decoration:none}
    .btn-primary{background:#245bc8;color:white}.btn-outline-secondary{border:1px solid #b5c1d4}
    .alert{padding:24px;border-radius:12px;margin:20px 0}.alert-success{background:#dbf3e5;color:#165838}
    .alert-warning{background:#fff0cc;color:#704b00}.text-success{color:#187447}.text-danger{color:#b62b37}
    .form-check{margin:12px 0}.form-check-input{margin-right:8px}
    .form-control{display:block;width:100%;padding:10px;border:1px solid #bbc6d7;border-radius:6px}
    .text-muted{color:#627087}.badge{padding:5px 10px;border-radius:5px}.bg-success{background:#187447;color:white}
  </style>
</head>
<body>
<nav class="navbar"><div class="container d-flex justify-content-between align-items-center">
  <a class="navbar-brand fw-bold" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
  <div>{% if user.is_authenticated %}
    <span class="me-3">{{ user.username }}</span>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-light btn-sm">Log out</button></form>
  {% else %}<a href="{% url 'login' %}">Log in</a>{% endif %}</div>
</div></nav>
<main class="container">{% block content %}{% endblock %}</main>
</body></html>
